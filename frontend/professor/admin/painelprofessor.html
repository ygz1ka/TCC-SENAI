<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel do Professor</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../tema-global.css?v=32">
<script>
    (function(){var t='claro';try{t=localStorage.getItem('tema')==='escuro'?'escuro':'claro'}catch(e){}document.documentElement.dataset.tema=t;document.documentElement.classList.toggle('dark',t==='escuro');})();
    </script>
<link rel="stylesheet" href="../../icons.css">
</head>

<body>
<button id="tema" class="tema-flutuante" type="button" aria-label="Alternar tema"><img id="icone-tema" src="../../imagens/moon.png" alt="Alternar tema"></button>

    <header>
        <h2>Secretaria Virtual SENAI</h2>

        <button id="sair">
            Sair
        </button>
    </header>

    <main>

        <h1>Painel do Professor</h1>
        <p>Gerenciamento acadêmico</p>

        <div class="opcoes-admin">

            <button onclick="window.location.href='gerenciar-alunos.html'">
                <svg class="icone-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <strong>Alunos</strong>
                <span>Visualizar e gerenciar alunos</span>
            </button>

            <button onclick="window.location.href='gerenciar-notas.html'">
                <svg class="icone-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 20 4-1 12-12-3-3L5 16zM15 6l3 3"/></svg>
                <strong>Notas</strong>
                <span>Lançar e alterar notas</span>
            </button>

            <button onclick="window.location.href='gerenciar-disciplinas.html'">
                <svg class="icone-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h5v16H4zM10 3h5v17h-5zM16 5l4-1 3 15-4 1z"/></svg>
                <strong>Disciplinas</strong>
                <span>Gerenciar disciplinas</span>
            </button>

            <button onclick="window.location.href='gerenciar-eventos.html'">
                <svg class="icone-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                <strong>Eventos</strong>
                <span>Criar e editar eventos</span>
            </button>

            <button onclick="window.location.href='gerenciar-comunicados.html'">
                <svg class="icone-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 14-6v14L3 13zM17 9a3 3 0 0 1 0 6M6 14l2 6h3l-2-6"/></svg>
                <strong>Comunicados</strong>
                <span>Publicar comunicados</span>
            </button>

            <button onclick="window.location.href='gerenciar-usuarios.html'">
                <svg class="icone-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M10 2h4l.6 2.4 2 .8 2.1-1.3 2.8 2.8-1.3 2.1.8 2L23 11v2l-2.4.6-.8 2 1.3 2.1-2.8 2.8-2.1-1.3-2 .8L14 22h-4l-.6-2.4-2-.8-2.1 1.3-2.8-2.8 1.3-2.1-.8-2L1 13v-2l2.4-.6.8-2-1.3-2.1 2.8-2.8 2.1 1.3 2-.8z"/></svg>
                <strong>Usuários</strong>
                <span>Gerenciar usuários do sistema</span>
            </button>

        </div>

    </main>

    <script src="painelprofessor.js"></script>

    <script src="../../tema.js?v=32"></script>
</body>
</html>
