<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Secretaria Virtual SENAI</title><link rel="stylesheet" href="style-login.css"><link rel="stylesheet" href="../tema-global.css?v=32"><link rel="stylesheet" href="cadastro.css"><link rel="stylesheet" href="../icons.css">
</head><body><header class="topo-login"><div class="marca-login"><div class="icone-marca"><svg class="icone-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 21v-5h6v5M8 7h2M14 7h2M8 11h2M14 11h2"/></svg></div><h1>Secretaria Virtual SENAI</h1></div><button id="tema" type="button" aria-label="Trocar tema"><img id="icone-tema" src="../imagens/moon.png" alt="Trocar tema"></button></header><main class="pagina-login"><section class="card-login"><div class="icone-principal"><svg class="icone-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 20 4-1 12-12-3-3L5 16zM15 6l3 3"/></svg></div><div class="cabecalho-login"><h2>Crie sua conta</h2><p>Preencha os dados para se cadastrar.</p></div><div class="linha-login"></div><form id="form-cadastro"><div class="grupo-campo"><label for="nome">Nome</label><div class="campo-login"><input id="nome" name="nome" type="text" placeholder="Senai" required maxlength="60" autocomplete="given-name"></div></div><div class="grupo-campo"><label for="sobrenome">Sobrenome</label><div class="campo-login"><input id="sobrenome" name="sobrenome" type="text" placeholder="Mogi" required maxlength="60" autocomplete="family-name"></div></div><div class="grupo-campo"><label for="username">Username</label><div class="campo-login"><input id="username" name="username" type="text" placeholder="senai2024" minlength="3" maxlength="30" required autocomplete="username"></div></div><div class="grupo-campo"><label for="senha">Senha</label><div class="campo-login"><input id="senha" name="senha" type="password" placeholder="Pelo menos 6 caracteres" minlength="6" required autocomplete="new-password"><button id="mostrar-senha" class="mostrar-senha" type="button"><svg class="icone-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div class="grupo-campo"><label for="tipo">Tipo de acesso</label><select id="tipo" required><option value="aluno">Aluno</option><option value="professor">Professor (demonstração)</option></select></div><p id="mensagem-cadastro" role="status" aria-live="polite"></p><button type="submit" class="botao-entrar">Cadastrar</button><p class="cadastro-login">Já tem conta? <a id="voltar-login" href="loginaluno.html">Fazer login</a></p></form></section></main><script src="cadastro.js"></script><script src="../tema.js?v=32"></script></body></html>
